<meta charset="UTF-8">
<title>예비군 정원 워치</title>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface-2:#eef1f5; --border:#dde2e8;
  --text:#161a1f; --text-2:#4b5563; --text-muted:#6b7280;
  --accent-1:#bfe0f2; --accent-2:#5b9bd0; --accent-3:#1c4f82;
  --red:#c8382a; --red-bg:#fbeceb;
  --good:#1c7a4d;
  font-synthesis: none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151a; --surface:#1a1f26; --surface-2:#222831; --border:#2c333d;
    --text:#edf0f3; --text-2:#b4bcc7; --text-muted:#88919c;
    --accent-1:#264057; --accent-2:#5b9bd0; --accent-3:#a9d3f2;
    --red:#e2685a; --red-bg:#3a2220;
    --good:#4fbf85;
  }
}
:root[data-theme="dark"]{
  --bg:#12151a; --surface:#1a1f26; --surface-2:#222831; --border:#2c333d;
  --text:#edf0f3; --text-2:#b4bcc7; --text-muted:#88919c;
  --accent-1:#264057; --accent-2:#5b9bd0; --accent-3:#a9d3f2;
  --red:#e2685a; --red-bg:#3a2220;
  --good:#4fbf85;
}
*{box-sizing:border-box;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  padding:20px 16px 40px; max-width:900px; margin:0 auto;
}
h1{font-size:20px; font-weight:700; margin:0 0 4px;}
.sub{color:var(--text-muted); font-size:13px; margin:0 0 20px; line-height:1.5;}
.panel{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:18px; margin-bottom:16px;
}
.controls{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end;}
.field{display:flex; flex-direction:column; gap:6px; min-width:150px;}
.field label{font-size:12px; color:var(--text-muted); font-weight:600;}
select, input[type=number]{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  border-radius:8px; padding:8px 10px; font-size:14px; font-variant-numeric:tabular-nums;
}
.toggle-row{display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:10px;}
.toggle-btn{
  flex:1; border:none; background:transparent; color:var(--text-2); font-size:12.5px;
  padding:8px 10px; border-radius:7px; cursor:pointer; font-weight:600; white-space:nowrap;
}
.toggle-btn.active{background:var(--accent-3); color:#fff;}
:root[data-theme="light"] .toggle-btn.active, :root:not([data-theme="dark"]):not([data-theme=""]) .toggle-btn.active {}
.headline{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:24px 20px; margin-bottom:16px; text-align:center;
}
.headline .label{font-size:13px; color:var(--text-muted); margin-bottom:8px; font-weight:600;}
.headline .year{font-size:56px; font-weight:800; line-height:1; letter-spacing:-0.02em;}
.headline .year.safe{color:var(--good);}
.headline .year.danger{color:var(--red);}
.headline .detail{font-size:13px; color:var(--text-2); margin-top:10px;}
svg{width:100%; height:auto; display:block; overflow:visible;}
.axis-label{font-size:10px; fill:var(--text-muted);}
.gridline{stroke:var(--border); stroke-width:1;}
.legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--text-2);}
.legend-item{display:flex; align-items:center; gap:6px;}
.swatch{width:14px; height:3px; border-radius:2px;}
.tooltip{
  position:absolute; background:var(--surface); border:1px solid var(--border); border-radius:8px;
  padding:8px 10px; font-size:12px; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.12);
  display:none; white-space:nowrap; z-index:5;
}
.tooltip .t-year{font-weight:700; margin-bottom:4px;}
.tooltip .t-row{display:flex; justify-content:space-between; gap:14px;}
.chart-wrap{position:relative;}
.note{font-size:11.5px; color:var(--text-muted); line-height:1.6; margin-top:14px; border-top:1px solid var(--border); padding-top:12px;}
table{width:100%; border-collapse:collapse; font-size:12px; margin-top:4px;}
th,td{text-align:right; padding:5px 6px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums;}
th:first-child, td:first-child{text-align:left;}
th{color:var(--text-muted); font-weight:600;}
details summary{cursor:pointer; font-size:13px; color:var(--text-2); font-weight:600; margin-bottom:8px;}
</style>

<h1>예비군 정원 워치</h1>
<p class="sub">코호트요인법+AI 모델 · 20~29세 남성 인구 기준 · 2025년 실측 기준점 + 예측(2026~2052) · 기준선을 직접 입력하면 언제 무너지는지 계산합니다.</p>

<div class="panel">
  <div class="controls">
    <div class="field">
      <label for="regionSel">지역</label>
      <select id="regionSel"></select>
    </div>
    <div class="field">
      <label for="thresholdInput">부대 편성 기준선 (만명)</label>
      <input type="number" id="thresholdInput" step="0.1" />
    </div>
    <div class="field" style="flex:1; min-width:220px;">
      <label>청년 유출입 강도 시나리오</label>
      <div class="toggle-row" id="toggleRow">
        <button class="toggle-btn" data-scn="outflow_down">유출 감소 (-5%)</button>
        <button class="toggle-btn active" data-scn="baseline">현재 추세 (0%)</button>
        <button class="toggle-btn" data-scn="outflow_up">유출 심화 (+5%)</button>
      </div>
    </div>
  </div>
</div>

<div class="headline">
  <div class="label" id="headlineLabel">기준선 붕괴 시점</div>
  <div class="year" id="headlineYear">—</div>
  <div class="detail" id="headlineDetail"></div>
</div>

<div class="panel">
  <div class="chart-wrap">
    <svg id="chart" viewBox="0 0 760 340" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="tooltip" id="tooltip"></div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="note">
    
  </div>
  <details style="margin-top:14px;">
    <summary>연도별 표로 보기</summary>
    <div style="max-height:260px; overflow:auto;">
      <table id="dataTable"></table>
    </div>
  </details>
</div>

<script>
(function(){
  var RAW = JSON.parse(document.getElementById('dashdata').textContent);
  var YEARS = RAW.years;
  var REGIONS = RAW.regions;
  var SCN_ORDER = ['outflow_down','baseline','outflow_up'];
  var SCN_LABEL = {outflow_down:'유출 감소 (-5%)', baseline:'현재 추세 (0%)', outflow_up:'유출 심화 (+5%)'};
  var SCN_COLOR = {outflow_down:'var(--accent-1)', baseline:'var(--accent-2)', outflow_up:'var(--accent-3)'};

  var state = { region:'전국', scenario:'baseline', threshold:null };

  var regionSel = document.getElementById('regionSel');
  REGIONS.forEach(function(r){
    var opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    if(r==='전국') opt.selected = true;
    regionSel.appendChild(opt);
  });

  var HIST_CUTOFF = RAW.hist_cutoff;

  function defaultThreshold(region){
    var vBase = RAW.data.baseline[region][String(HIST_CUTOFF)];
    return Math.round(vBase * 0.45 * 10) / 10;
  }

  var thresholdInput = document.getElementById('thresholdInput');

  function seriesFor(scn, region){
    return YEARS.map(function(y){ return RAW.data[scn][region][String(y)]; });
  }

  function findCrossYear(vals, threshold){
    for(var i=0;i<YEARS.length;i++){
      if(vals[i] !== null && vals[i] !== undefined && vals[i] < threshold) return YEARS[i];
    }
    return null;
  }

  var svgNS = "http://www.w3.org/2000/svg";
  function el(tag, attrs){
    var e = document.createElementNS(svgNS, tag);
    for(var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  var PAD = {l:44, r:16, t:16, b:26};
  var W = 760, H = 340;

  function render(){
    var region = state.region;
    thresholdInput.value = state.threshold;
    var threshold = state.threshold;

    var allVals = [];
    SCN_ORDER.forEach(function(s){ allVals = allVals.concat(seriesFor(s, region).filter(function(v){return v!=null;})); });
    allVals.push(threshold);
    var maxV = Math.max.apply(null, allVals) * 1.08;
    var minV = 0;

    function x(i){ return PAD.l + (W-PAD.l-PAD.r) * (i/(YEARS.length-1)); }
    function y(v){ return H-PAD.b - (H-PAD.t-PAD.b) * ((v-minV)/(maxV-minV)); }

    var svg = document.getElementById('chart');
    svg.innerHTML = '';
    svg.setAttribute('viewBox','0 0 '+W+' '+H);

    // gridlines + y labels
    var ticks = 5;
    for(var t=0;t<=ticks;t++){
      var v = maxV*t/ticks;
      var yy = y(v);
      svg.appendChild(el('line',{x1:PAD.l,x2:W-PAD.r,y1:yy,y2:yy,class:'gridline'}));
      var lbl = el('text',{x:PAD.l-6,y:yy+3,class:'axis-label','text-anchor':'end'});
      lbl.textContent = Math.round(v);
      svg.appendChild(lbl);
    }
    // x labels every ~4 years
    YEARS.forEach(function(yr,i){
      if(yr % 5 === 0 || i===0 || i===YEARS.length-1){
        var lbl = el('text',{x:x(i),y:H-6,class:'axis-label','text-anchor':'middle'});
        lbl.textContent = yr;
        svg.appendChild(lbl);
      }
    });
    // 실측/예측 경계선
    if(YEARS.indexOf(HIST_CUTOFF) >= 0){
      var cutX = x(YEARS.indexOf(HIST_CUTOFF));
      svg.appendChild(el('line',{x1:cutX,x2:cutX,y1:PAD.t,y2:H-PAD.b,stroke:'var(--border)','stroke-width':1,'stroke-dasharray':'2,3'}));
      var cutLbl = el('text',{x:cutX,y:PAD.t+10,class:'axis-label','text-anchor':'middle'});
      cutLbl.textContent = '실측↔예측';
      svg.appendChild(cutLbl);
    }

    // threshold red line
    var ty = y(threshold);
    svg.appendChild(el('line',{x1:PAD.l,x2:W-PAD.r,y1:ty,y2:ty,stroke:'var(--red)','stroke-width':2,'stroke-dasharray':'6,4'}));
    var rlabel = el('text',{x:W-PAD.r,y:ty-6,class:'axis-label','text-anchor':'end',fill:'var(--red)'});
    rlabel.setAttribute('fill','var(--red)');
    rlabel.textContent = '기준선 '+threshold+'만명';
    svg.appendChild(rlabel);

    // lines
    SCN_ORDER.forEach(function(s){
      var vals = seriesFor(s, region);
      var pts = [];
      vals.forEach(function(v,i){ if(v!=null) pts.push(x(i)+','+y(v)); });
      var isActive = s===state.scenario;
      var path = el('polyline',{
        points: pts.join(' '), fill:'none',
        stroke: SCN_COLOR[s],
        'stroke-width': isActive ? 3 : 1.5,
        opacity: isActive ? 1 : 0.55,
        'stroke-linecap':'round','stroke-linejoin':'round'
      });
      svg.appendChild(path);
    });

    // crossing marker for active scenario
    var activeVals = seriesFor(state.scenario, region);
    var crossYear = findCrossYear(activeVals, threshold);
    if(crossYear!=null){
      var idx = YEARS.indexOf(crossYear);
      var cx = x(idx), cy = y(activeVals[idx]);
      svg.appendChild(el('line',{x1:cx,x2:cx,y1:PAD.t,y2:H-PAD.b,stroke:'var(--red)','stroke-width':1,'stroke-dasharray':'3,3',opacity:0.6}));
      var dot = el('circle',{cx:cx,cy:cy,r:5,fill:'var(--red)',stroke:'var(--surface)','stroke-width':2});
      svg.appendChild(dot);
    }

    // hover targets
    YEARS.forEach(function(yr,i){
      var hit = el('rect',{x:x(i)-8,y:PAD.t,width:16,height:H-PAD.t-PAD.b,fill:'transparent'});
      hit.addEventListener('mouseenter', function(){ showTooltip(i); });
      hit.addEventListener('mousemove', function(evt){ positionTooltip(evt); });
      hit.addEventListener('mouseleave', hideTooltip);
      svg.appendChild(hit);
    });

    // headline
    var headlineYear = document.getElementById('headlineYear');
    var headlineDetail = document.getElementById('headlineDetail');
    if(crossYear!=null){
      headlineYear.textContent = crossYear + '년';
      headlineYear.className = 'year danger';
      headlineDetail.textContent = region+' · '+SCN_LABEL[state.scenario]+' 시나리오 기준, '+crossYear+'년에 예측 인구('+activeVals[YEARS.indexOf(crossYear)].toFixed(1)+'만명)가 기준선('+threshold+'만명) 아래로 떨어집니다.';
    } else {
      headlineYear.textContent = '2052년까지 유지';
      headlineYear.className = 'year safe';
      headlineDetail.textContent = region+' · '+SCN_LABEL[state.scenario]+' 시나리오 기준, 예측 구간(~2052년) 내에는 기준선 아래로 떨어지지 않습니다.';
    }

    // legend
    var legend = document.getElementById('legend');
    legend.innerHTML = '';
    SCN_ORDER.forEach(function(s){
      var item = document.createElement('div'); item.className='legend-item';
      var sw = document.createElement('span'); sw.className='swatch'; sw.style.background = SCN_COLOR[s].replace('var(','').replace(')','');
      sw.style.background = getComputedStyle(document.documentElement).getPropertyValue(SCN_COLOR[s].slice(4,-1)) || '';
      sw.style.backgroundColor = cssVar(SCN_COLOR[s]);
      var txt = document.createElement('span'); txt.textContent = SCN_LABEL[s] + (s===state.scenario ? ' (선택됨)' : '');
      item.appendChild(sw); item.appendChild(txt);
      legend.appendChild(item);
    });
    var rsw = document.createElement('div'); rsw.className='legend-item';
    var rswatch = document.createElement('span'); rswatch.className='swatch'; rswatch.style.backgroundColor = cssVar('var(--red)');
    var rtxt = document.createElement('span'); rtxt.textContent = '부대 편성 기준선';
    rsw.appendChild(rswatch); rsw.appendChild(rtxt);
    legend.appendChild(rsw);

    // table
    var table = document.getElementById('dataTable');
    var thead = '<thead><tr><th>연도</th>';
    SCN_ORDER.forEach(function(s){ thead += '<th>'+SCN_LABEL[s]+'</th>'; });
    thead += '</tr></thead>';
    var tbody = '<tbody>';
    YEARS.forEach(function(yr,i){
      tbody += '<tr><td>'+yr+'</td>';
      SCN_ORDER.forEach(function(s){
        var v = seriesFor(s, region)[i];
        tbody += '<td>'+(v!=null ? v.toFixed(1) : '-')+'</td>';
      });
      tbody += '</tr>';
    });
    tbody += '</tbody>';
    table.innerHTML = thead+tbody;

    function cssVar(v){
      var name = v.replace('var(','').replace(')','').trim();
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#888';
    }
  }

  function showTooltip(i){
    var tip = document.getElementById('tooltip');
    var region = state.region;
    var year = YEARS[i];
    var html = '<div class="t-year">'+year+'년 · '+region+'</div>';
    SCN_ORDER.forEach(function(s){
      var v = seriesFor(s, region)[i];
      html += '<div class="t-row"><span>'+SCN_LABEL[s]+'</span><strong>'+(v!=null?v.toFixed(1):'-')+'만명</strong></div>';
    });
    tip.innerHTML = html;
    tip.style.display = 'block';
  }
  function positionTooltip(evt){
    var tip = document.getElementById('tooltip');
    var wrap = document.querySelector('.chart-wrap');
    var rect = wrap.getBoundingClientRect();
    var lx = evt.clientX - rect.left;
    var ly = evt.clientY - rect.top;
    tip.style.left = Math.min(lx+12, rect.width-160) + 'px';
    tip.style.top = Math.max(ly-50, 0) + 'px';
  }
  function hideTooltip(){ document.getElementById('tooltip').style.display='none'; }

  regionSel.addEventListener('change', function(){
    state.region = regionSel.value;
    state.threshold = defaultThreshold(state.region);
    render();
  });
  thresholdInput.addEventListener('input', function(){
    var v = parseFloat(thresholdInput.value);
    if(!isNaN(v) && v>0){ state.threshold = v; render(); }
  });
  document.querySelectorAll('.toggle-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.toggle-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.scenario = btn.getAttribute('data-scn');
      render();
    });
  });

  state.threshold = defaultThreshold(state.region);
  render();
})();
</script>
